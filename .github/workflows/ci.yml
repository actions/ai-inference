name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  models: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run test
        env:
          GITHUB_TOKEN: ${{ github.token }}

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Prepare Mock Copilot CLI
        run: chmod +x script/mock-copilot-cli.mjs

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          prompt: hello
          copilot-cli-path: script/mock-copilot-cli.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Print Output
        id: output
        env:
          RESPONSE: ${{ steps.test-action.outputs.response }}
        run: printf '%s\n' "$RESPONSE"

      - name: Verify Output
        env:
          RESPONSE: ${{ steps.test-action.outputs.response }}
        run: |
          if [[ -z "$RESPONSE" ]]; then
            echo "Error: No response received"
            exit 1
          fi
          printf 'Response received: %s\n' "$RESPONSE"

  test-action-prompt-file:
    name: GitHub Actions Test with Prompt File
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Prepare Mock Copilot CLI
        run: chmod +x script/mock-copilot-cli.mjs

      - name: Create Prompt File
        run: echo "hello" > prompt.txt

      - name: Create System Prompt File
        run: echo "You are a helpful AI assistant for testing." > system-prompt.txt

      - name: Test Local Action with Prompt File
        id: test-action-prompt-file
        uses: ./
        with:
          prompt-file: prompt.txt
          system-prompt-file: system-prompt.txt
          copilot-cli-path: script/mock-copilot-cli.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Print Output
        run: |
          echo "Response saved to: ${{ steps.test-action-prompt-file.outputs.response-file }}"
          cat "${{ steps.test-action-prompt-file.outputs.response-file }}"

      - name: Verify Output
        run: |
          response_file="${{ steps.test-action-prompt-file.outputs.response-file }}"
          if [[ ! -f "$response_file" ]]; then
            echo "Error: Response file not found"
            exit 1
          fi
          content=$(cat "$response_file")
          if [[ -z "$content" ]]; then
            echo "Error: Response file is empty"
            exit 1
          fi
          echo "Response file content: $content"
